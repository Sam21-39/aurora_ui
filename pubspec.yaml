name: aurora_ui
description: >-
  Premium iOS glass UI for Flutter. Pixel-accurate Apple material system,
  vibrancy effects, Liquid Glass, and a full component library.
version: 1.0.0
homepage: https://appamania.in
repository: https://github.com/appamania/aurora_ui
issue_tracker: https://github.com/appamania/aurora_ui/issues
documentation: https://pub.dev/documentation/aurora_ui/latest/

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ">=2.1.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: in.appamania.aurora_ui
        pluginClass: AuroraUiPlugin
      ios:
        pluginClass: AuroraUiPlugin

topics:
  - ui
  - glass
  - ios
  - design-system
  - material

funding:
  - https://paywithchai.in/appamania
