name: PR Validation

on:
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|chore|release)\/ ]] && [[ "$BRANCH" != "dev" ]]; then
            echo "❌ Invalid branch: $BRANCH"
            echo "   Use: feature/*, fix/*, docs/*, chore/*, release/*"
            exit 1
          fi
          echo "✅ Branch name valid"

      - name: Check CHANGELOG updated
        run: |
          if git diff --name-only origin/dev...HEAD | grep -q CHANGELOG.md; then
            echo "✅ CHANGELOG updated"
          else
            echo "⚠️  CHANGELOG.md not modified"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: flutter test
